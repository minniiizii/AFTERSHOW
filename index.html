<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AFTERSHOW — 개인 콘서트 아카이브. The show ends. The memory stays.">
  <meta name="theme-color" content="#0B0D12">
  <title>AFTERSHOW</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/css/style.css">

  <style>
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="app-header" role="banner"></header>

  <!-- Mobile Nav Drawer -->
  <nav class="mobile-nav-drawer" id="mobile-nav" role="navigation" aria-label="모바일 메뉴"></nav>

  <!-- Main Content -->
  <main id="app-content" role="main" tabindex="-1"></main>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modal-overlay"></div>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- External 3D Library (Three.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Data -->
  <script src="./src/data/concerts.js"></script>
  <script src="./src/data/stageData.js"></script>

  <!-- Core App & Visualizers -->
  <script src="./src/js/app.js"></script>
  <script src="./src/js/stage2d.js"></script>
  <script src="./src/js/stage3d.js"></script>

  <!-- Pages -->
  <script src="./src/pages/home.js"></script>
  <script src="./src/pages/venues.js"></script>
  <script src="./src/pages/concert.js"></script>
  <script src="./src/pages/archive.js"></script>
  <script src="./src/pages/search.js"></script>
  <script src="./src/pages/stage.js"></script>

  <!-- Router Init -->
  <script>
    (function() {
      // Register routes
      Router.register('/', () => PageHome.render());
      Router.register('/venues', () => PageVenues.renderVenues());
      Router.register('/venues/:venueId', (_, p) => PageVenues.renderVenueDetail(p.venueId));
      Router.register('/concerts/:concertId', (path, p) => PageConcert.render(path, p));
      Router.register('/concerts/:concertId/stage', (path, p) => PageStage.render(path, p));
      Router.register('/archive', () => PageArchive.render());
      Router.register('/search', () => PageSearch.render());

      function boot() {
        initHeader();
        Router.init();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
